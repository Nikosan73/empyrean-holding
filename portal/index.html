<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='120 0 784 784'%3E%3CclipPath id='c'%3E%3Ccircle cx='512' cy='391' r='384'/%3E%3C/clipPath%3E%3Ccircle cx='512' cy='391' r='384' fill='%23fff' stroke='%23000' stroke-width='28'/%3E%3Cg clip-path='url(%23c)'%3E%3Cpath d='M500 352 706 158 940 377V800H500Z' fill='%23595959'/%3E%3Cpath d='M80 572 363 378 580 525V800H80Z' fill='%23000'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #050505;
    --paper: #f7f7f5;
    --grey: #595959;
    --mute: #8a8a8a;
    --line: #242424;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); }
  body {
    color: var(--paper);
    font-family: "Avenir LT Pro", "Avenir LT Pro 35 Light", "Avenir", "Avenir Next", "Jost", system-ui, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 24px clamp(16px, 4vw, 48px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; }
  .brand svg { width: 34px; height: 34px; }
  .brand span { font-size: 13px; font-weight: 400; letter-spacing: .36em; text-transform: uppercase; }
  .who { display: flex; align-items: center; gap: 22px; font-size: 12px; letter-spacing: .12em; color: var(--mute); }
  .who a {
    color: var(--mute); text-decoration: none;
    font-size: 11px; font-weight: 400; letter-spacing: .32em; text-transform: uppercase;
    transition: color .4s;
  }
  .who a:hover, .who a:focus-visible { color: var(--paper); }

  main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: clamp(56px, 12vh, 140px) 16px; }
  .label {
    font-size: 12px; font-weight: 400; letter-spacing: .42em; text-transform: uppercase;
    color: var(--mute);
    display: flex; align-items: center; gap: 18px;
    margin-bottom: clamp(28px, 5vh, 52px);
  }
  .label::before { content: ""; width: 42px; height: 1px; background: currentColor; opacity: .6; }
  h1 { font-size: clamp(36px, 6.4vw, 88px); font-weight: 300; line-height: 1.04; letter-spacing: -.01em; }
  .links {
    list-style: none;
    margin-top: clamp(48px, 9vh, 104px);
    border-top: 1px solid var(--line);
  }
  .links a {
    display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 16px;
    padding: clamp(20px, 3.6vh, 34px) 0;
    border-bottom: 1px solid var(--line);
    color: var(--paper); text-decoration: none;
    transition: padding-left .7s var(--ease), color .4s;
  }
  .links a:hover, .links a:focus-visible { padding-left: clamp(8px, 2vw, 24px); }
  .links .name { font-size: clamp(22px, 3.2vw, 40px); font-weight: 300; }
  .links .note { display: block; margin-top: 6px; font-size: 13px; letter-spacing: .08em; color: var(--mute); }
  .links .go { font-size: 22px; color: var(--mute); transition: transform .7s var(--ease), color .4s; }
  .links a:hover .go { transform: translateX(6px); color: var(--paper); }
  .empty {
    padding: clamp(28px, 5vh, 48px) 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px; font-weight: 400; letter-spacing: .32em; text-transform: uppercase;
    color: var(--mute);
  }
  footer {
    padding: 32px 16px; text-align: center;
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase; color: var(--grey);
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="../">
    <svg viewBox="120 0 784 784" aria-hidden="true">
      <clipPath id="disc"><circle cx="512" cy="391" r="381"/></clipPath>
      <g clip-path="url(#disc)">
        <path d="M500 352 706 158 940 377V800H500Z" fill="#595959"/>
        <path d="M60 586 363 378 580 525V800H60Z" fill="#f7f7f5"/>
      </g>
      <circle cx="512" cy="391" r="384" fill="none" stroke="#f7f7f5" stroke-width="22"/>
    </svg>
    <span>Empyrean</span>
  </a>
  <div class="who">
    <span id="user"></span>
    <!-- Cloudflare Access sign-out endpoint -->
    <a href="/cdn-cgi/access/logout">Sign out</a>
  </div>
</header>

<main>
  <p class="label">Portal</p>
  <h1>Welcome.</h1>
  <ul class="links" id="links"></ul>
</main>

<footer>&copy; <span id="yr">2026</span> Empyrean Developments</footer>

<script>
  // Edit this list to add links. Each entry: { name, url, note (optional) }
  const LINKS = [
  ];

  const list = document.getElementById('links');
  if (!LINKS.length) {
    list.innerHTML = '<li class="empty">Links to follow</li>';
  } else {
    LINKS.forEach(l => {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener';
      const text = document.createElement('span');
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = l.name;
      text.appendChild(name);
      if (l.note) {
        const note = document.createElement('span');
        note.className = 'note';
        note.textContent = l.note;
        text.appendChild(note);
      }
      const go = document.createElement('span');
      go.className = 'go';
      go.setAttribute('aria-hidden', 'true');
      go.textContent = '↗';
      a.append(text, go);
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  document.getElementById('yr').textContent = new Date().getFullYear();

  // Show the signed-in email from Cloudflare Access, when available
  fetch('/cdn-cgi/access/get-identity', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : null)
    .then(id => { if (id && id.email) document.getElementById('user').textContent = id.email; })
    .catch(() => {});
</script>
</body>
</html>
